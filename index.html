<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smooth Scroll Page</title>
    <style>
        /* General styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
          scroll-behavior: smooth;
        }


     
         /*tu peux aussi mettre*/
      
        body {
            font-family: Arial, sans-serif;
            scroll-behavior: smooth;
            /* CSS smooth scroll */
        }

        /* Navbar styles */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: #333;
            padding: 10px 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 1000;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        /* Section styles */
        .section {
            height: 100vh;
            padding-top: 60px;
            /* Offset for navbar */
            padding-left: 20px;
            font-size: 24px;
            display: flex;
            align-items: center;
        }

        #section1 {
            background-color: #f44336;
            color: white;
        }

        #section2 {
            background-color: #2196F3;
            color: white;
        }

        #section3 {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="#section1">Section 1</a>
        <a href="#section2">Section 2</a>
        <a href="#section3">Section 3</a>
    </nav>

    <!-- Page Sections -->
    <section id="section1" class="section">Welcome to Section 1</section>
    <section id="section2" class="section">Welcome to Section 2</section>
    <section id="section3" class="section">Welcome to Section 3</section>

    <!-- Optional JavaScript for smoother scroll fallback -->
    <script>
        // Enhance smooth scrolling for older browsers
        document.querySelectorAll('.navbar a').forEach(link => {
            link.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });
    </script>

</body>

</html>
